<!DOCTYPE html>
<html lang="en">
<head>
    <title>🎧 Speech Emotion Recognition Dashboard 🎧</title>
    <!-- CSS Styling -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9fafb;
            color: #333;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            color: #4caf50;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.8rem;
            margin-top: 40px;
            color: #2196F3;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .form-container {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }
        .form-container input[type="file"] {
            padding: 10px;
            border: 2px solid #4caf50;
            border-radius: 5px;
            width: 250px;
            margin: 10px 0;
        }
        .form-container button {
            padding: 12px 20px;
            background-color: #4caf50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        .form-container button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat-box {
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 15px;
            width: 150px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .stat-box:hover {
            background-color: #f4f4f4;
            transform: scale(1.05);
        }
        #loading {
            display: none;
            font-size: 18px;
            color: #ff9800;
            margin-top: 10px;
        }
        #error {
            color: #ff0000;
            font-weight: bold;
            margin-top: 10px;
        }
        #success {
            color: #4caf50;
            font-weight: bold;
            margin-top: 10px;
        }
        img {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            border: 2px solid #ddd;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .link:hover {
            text-decoration: underline;
        }
    </style>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Fetch performance metrics every 2 seconds
        function fetchPerformance() {
            fetch("/performance")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("accuracy").innerText = data.Accuracy || "N/A";
                    document.getElementById("precision").innerText = data.Precision || "N/A";
                    document.getElementById("recall").innerText = data.Recall || "N/A";
                    document.getElementById("f1").innerText = data["F1 Score"] || "N/A";
                })
                .catch(err => {
                    console.error("Failed to fetch performance data:", err);
                    ["accuracy", "precision", "recall", "f1"].forEach(id => {
                        document.getElementById(id).innerText = "Error";
                    });
                });
        }
        // Fetch data every 2 seconds
        setInterval(fetchPerformance, 2000);
        // Show loading animation when submitting the form
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        // Reset loading after a short delay (simulated for smoother UX)
        function resetLoading() {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 3000);
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>🎉 Speech Emotion Recognition Dashboard 🎉</h1>
        
        <!-- Upload Audio File for Prediction -->
        <div class="form-container">
            <h2>🎧 Upload Audio File for Emotion Prediction</h2>
            <form action="/predict" method="post" enctype="multipart/form-data" onsubmit="showLoading()">
                <input type="file" name="file" accept=".wav" required />
                <button type="submit">Predict Emotion from File</button>
            </form>
        </div>

        <div id="loading">🔄 Processing... Please wait</div>

        <!-- Record Live Audio for Prediction -->
        <div class="form-container">
            <h2>🎙️ Record and Predict Live Emotion</h2>
            <form action="/record" method="post">
                <button type="submit" onclick="showLoading()">Record and Predict Emotion (Live)</button>
            </form>
        </div>

        <!-- Display Performance Metrics 
        <h2>📌 Performance Metrics</h2>
        <div class="stats">
            <div class="stat-box">
                <strong>Accuracy</strong><br>
                <span id="accuracy">Loading...</span>
            </div>
            <div class="stat-box">
                <strong>Precision</strong><br>
                <span id="precision">Loading...</span>
            </div>
            <div class="stat-box">
                <strong>Recall</strong><br>
                <span id="recall">Loading...</span>
            </div>
            <div class="stat-box">
                <strong>F1 Score</strong><br>
                <span id="f1">Loading...</span>
            </div>
        </div>  -->

        <!-- Display Confusion Matrix -->
        <h2>📈 Confusion Matrix</h2>
        <img id="confusion-matrix" src="/static/confusion_matrix.png" alt="Confusion Matrix"
        onerror="this.onerror=null; this.src='/static/placeholder.png'; this.alt='No matrix generated yet!'" />
        
        <script>
            // Refresh Confusion Matrix every 2 seconds
            function refreshConfusionMatrix() {
                const img = document.getElementById('confusion-matrix');
                img.src = '/static/confusion_matrix.png?' + new Date().getTime(); // Force cache bypass
            }
            setInterval(refreshConfusionMatrix, 2000);
        </script>

        <!-- Success/Error Messages -->
        <div id="success">✨ Predictions ready!</div>
        <div id="error" style="display:none;">⚠️ Something went wrong — try again!</div>

        <!-- Link to Emotion Graph Visualization -->
        <div class="button-container">
            <a class="link" href="/emotion_graph">📊 View Emotion Tracking Graph</a>
        </div>
    </div>
</body>
</html>
